# One-click deploy on Render: New > Blueprint > pick this repo.
services:
  - type: web
    name: dream-team
    runtime: node
    region: singapore        # closest Render region to India; can't be changed later
    # No plan line on purpose: Render's default paid instance (0.5 CPU, 512 MB). The free plan can't keep a disk.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false          # Render asks for this once, when you create the Blueprint
      - key: DB_PATH
        value: /var/data/dream-team.db
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
